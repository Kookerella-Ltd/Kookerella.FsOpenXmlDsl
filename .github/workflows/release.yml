name: Release

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # 6.0.x is needed for fake-cli's own script host, which still compiles build.fsx
          # against net6.0 regardless of which SDK builds the solution itself - without it,
          # `dotnet fake run` fails with "Could not find referenced assemblies" because
          # windows-latest no longer ships a .NET 6 SDK (6.0 went EOL).
          dotnet-version: |
            6.0.x
            10.0.x

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Publish all packages
        run: dotnet fake run build.fsx -t PublishAll
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      # --single-target on both of these: PublishAll above already ran the full test gate in
      # this same job, so re-running PublishMcpSelfContained's normal dependency chain
      # (TestSlow -> PackMcpSelfContained -> PublishMcpSelfContained) would redo Clean/
      # Restore/Build/TestFast/TestSlow a second time for no reason.
      - name: Build self-contained binaries
        run: dotnet fake run build.fsx -t PackMcpSelfContained --single-target

      - name: Publish self-contained binaries
        run: dotnet fake run build.fsx -t PublishMcpSelfContained --single-target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
